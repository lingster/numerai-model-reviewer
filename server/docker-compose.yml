# Self-hosted Numerai API.
#
#   cp .env.example .env    # optional: every setting has a default
#   docker compose up -d --build api scheduler
#
# Compose runs from server/ but builds with the repository root as context, so
# the image can include worker/ as well.

# Shared by every service that opens the database: the same image, user,
# lockdown and data directory, so the API and its jobs cannot drift apart.
x-database-service: &database-service
  image: numerai-api:latest
  restart: unless-stopped
  # Run as a dedicated host user that owns only DATA_DIR, so an escape from
  # the container lands on a UID with nothing else on the host. Defaults to
  # the image's own unprivileged user.
  user: "${APP_UID:-numerai}:${APP_GID:-numerai}"
  # Nothing but /data (and scratch in /tmp) needs to be writable.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    # A host path (e.g. /data/numerai/numerdiff) bind-mounts that directory;
    # unset, a named volume is used. The directory must be owned by APP_UID.
    - ${DATA_DIR:-numerai-data}:/data

services:
  api:
    <<: *database-service
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: numerai-api
    ports:
      # Bound to localhost: Cloudflare Tunnel reaches it from the host, so the
      # API is never exposed on the LAN or the internet directly.
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_PATH: /data/numerai-cache.sqlite
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      ALLOWED_ORIGIN_SUFFIXES: ${ALLOWED_ORIGIN_SUFFIXES:-}
      NUMERAI_API_URL: ${NUMERAI_API_URL:-https://api-tournament.numer.ai/graphql}
      NUMERAI_PUBLIC_KEY: ${NUMERAI_PUBLIC_KEY:-}
      NUMERAI_SECRET_KEY: ${NUMERAI_SECRET_KEY:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A pending migration runs before the server listens (0003 takes ~20s).
      start_period: 60s

  # Nightly jobs from server/crontab: backup at 03:00 UTC, then precompute of
  # all three tournaments at 04:30. Logs: `docker compose logs -f scheduler`.
  # Run a job now: `docker compose exec scheduler /app/server/jobs/nightly-precompute.sh`.
  scheduler:
    <<: *database-service
    container_name: numerai-scheduler
    command: ["supercronic", "-passthrough-logs", "/app/server/crontab"]
    environment:
      DATABASE_PATH: /data/numerai-cache.sqlite
      NUMERAI_API_URL: ${NUMERAI_API_URL:-https://api-tournament.numer.ai/graphql}
      PRECOMPUTE_CACHE_DIR: /data/.precompute-cache
      PRECOMPUTE_TOURNAMENTS: ${PRECOMPUTE_TOURNAMENTS:-8 11 12}
      PRECOMPUTE_TOP_N: ${PRECOMPUTE_TOP_N:-1000000}
      PRECOMPUTE_BACKFILL_ROUNDS: ${PRECOMPUTE_BACKFILL_ROUNDS:-5000}
      PRECOMPUTE_REFRESH_OVERLAP: ${PRECOMPUTE_REFRESH_OVERLAP:-70}
      # Classic's leaderboard is ~15k models, ~11k unstaked. Capturing them costs
      # fetch time but means ranking one does not need a live Numerai call.
      PRECOMPUTE_INCLUDE_UNSTAKED: ${PRECOMPUTE_INCLUDE_UNSTAKED:-1}
      BACKUP_DIR: /data/backups
      # A full backfill of Classic holds millions of rows in memory.
      NODE_OPTIONS: --max-old-space-size=12288
    # The image's healthcheck probes the API port, which this service does not serve.
    healthcheck:
      disable: true
    # The API applies pending migrations at startup; let it finish first.
    depends_on:
      api:
        condition: service_healthy

  # Publishes the API on a hostname without opening a port on your router.
  # Create the tunnel in the Cloudflare dashboard, put its token in .env, and
  # point the public hostname at http://api:8787.
  # Opt-in: `docker compose --profile tunnel up -d`. Skip it if the host
  # already runs cloudflared — route a hostname to http://127.0.0.1:8787 there.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    container_name: numerai-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  numerai-data:
