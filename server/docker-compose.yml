# Self-hosted Numerai API.
#
#   cp .env.example .env && edit
#   docker compose up -d --build
#
# Compose runs from server/ but builds with the repository root as context, so
# the image can include worker/ as well.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: numerai-api:latest
    container_name: numerai-api
    restart: unless-stopped
    ports:
      # Bound to localhost: Cloudflare Tunnel reaches it from the host, so the
      # API is never exposed on the LAN or the internet directly.
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_PATH: /data/numerai-cache.sqlite
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      ALLOWED_ORIGIN_SUFFIXES: ${ALLOWED_ORIGIN_SUFFIXES:-}
      NUMERAI_API_URL: ${NUMERAI_API_URL:-https://api-tournament.numer.ai/graphql}
      NUMERAI_PUBLIC_KEY: ${NUMERAI_PUBLIC_KEY:?set NUMERAI_PUBLIC_KEY in .env}
      NUMERAI_SECRET_KEY: ${NUMERAI_SECRET_KEY:?set NUMERAI_SECRET_KEY in .env}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - numerai-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Publishes the API on a hostname without opening a port on your router.
  # Create the tunnel in the Cloudflare dashboard, put its token in .env, and
  # point the public hostname at http://api:8787.
  # Remove this service if you terminate TLS some other way.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: numerai-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env, or remove this service}
    depends_on:
      api:
        condition: service_healthy

volumes:
  numerai-data:
