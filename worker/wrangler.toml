name = "numerai-api-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-05"
account_id = "bc2043c616d427139c181d21fc6274c7"

# Custom domain configuration for API backend
routes = [
  { pattern = "numerdiff-api.imperialai.ai/*", zone_name = "imperialai.ai" }
]

# Precompute scheduling lives outside the worker — full backfill of 5k+ models
# doesn't fit in a worker cron's CPU budget. Run worker/src/precompute.ts via
# `npm run precompute:prod` (manual) or a GitHub Actions schedule. A scheduled()
# handler for incremental refresh can be added later if needed.

# Environment variables (non-sensitive)
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://numerdiff.imperialai.ai"
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW_SECONDS = "60"
NUMERAI_API_URL = "https://api-tournament.numer.ai/graphql"

# KV Namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "a99eaf0e2f4a4be2b587bd6944926415"

# D1 database for cached rankings data (top staked models + per-round performance)
[[d1_databases]]
binding = "DB"
database_name = "numerai-cache"
database_id = "fed45222-4fc5-4acf-a089-cc798ee6f98e"

# Secrets (set via wrangler secret put):
# - NUMERAI_PUBLIC_KEY
# - NUMERAI_SECRET_KEY
#
# Run these commands to set secrets:
#   wrangler secret put NUMERAI_PUBLIC_KEY
#   wrangler secret put NUMERAI_SECRET_KEY
