name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The self-hosted API bridge (server/). Separate job: it shares no setup with
  # the worker/Playwright run, and a failure here should name itself.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The bridge runs the worker's own handler, so the worker's dependencies
      # must be installed for its imports to resolve.
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit -p .

      - name: Run server tests
        working-directory: server
        run: npm test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Worker unit tests, including the D1 query-cost budgets (d1-query-cost.test.ts),
      # which run against an in-process Miniflare D1 and need no running worker.
      # rankings-api.test.ts is excluded: it expects a live-sized dataset (rank 13
      # of 4,046 models) that test/seed.sql does not provide, and an Origin the
      # worker does not allow, so it fails on main today independent of any change.
      - name: Run worker unit tests
        working-directory: worker
        run: npx vitest run --exclude src/rankings-api.test.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Seed a local (miniflare) D1 with a deterministic fixture so the
      # /rankings/model-rank integration tests run against real worker code with
      # known data — no Cloudflare account, secrets, or network required.
      - name: Seed local D1
        working-directory: worker
        run: |
          npx wrangler d1 execute numerai-cache --local --persist-to=.wrangler/state --yes --file=src/schema.sql
          # Then migrations, in order — a fresh database is schema.sql + migrations/*.sql.
          for migration in $(ls migrations/*.sql | sort); do
            npx wrangler d1 execute numerai-cache --local --persist-to=.wrangler/state --yes --file="$migration"
          done
          npx wrangler d1 execute numerai-cache --local --persist-to=.wrangler/state --yes --file=test/seed.sql

      - name: Start worker (local)
        working-directory: worker
        run: |
          nohup npx wrangler dev --local --persist-to=.wrangler/state --port 8787 --ip 127.0.0.1 \
            > /tmp/wrangler.log 2>&1 &
          echo "Started wrangler dev (pid $!)"

      - name: Wait for worker health
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "Worker healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Worker failed to start; logs:"; cat /tmp/wrangler.log; exit 1

      - name: Run unit + integration tests
        env:
          WORKER_API_URL: http://127.0.0.1:8787
        run: npm run test:unit -- --run

      - name: Worker logs (on failure)
        if: failure()
        run: cat /tmp/wrangler.log || true
