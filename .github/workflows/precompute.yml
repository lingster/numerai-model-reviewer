name: Precompute Rankings

# Refreshes the D1-backed rankings cache (top staked models + per-round
# performance) for Classic, Signals and Crypto. Runs the standalone precompute
# script from worker/, which writes to the remote D1 via wrangler.
#
# Runs in GitHub Actions rather than a worker cron because a full 5k-model
# backfill exceeds a Cloudflare Worker's CPU budget.
#
# The precompute is incremental: it reads the last round already in D1 and only
# fetches/writes newer rounds (plus a small overlap), so a daily run is small and
# fast. The three tournament steps are decoupled via `!cancelled()` so a failure
# in one no longer skips the others.

on:
  schedule:
    # 06:00 UTC daily — after Numerai's daily round resolution (~04:00 UTC).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tournament:
        description: 'Tournament to refresh (8=Classic, 11=Signals, 12=Crypto, all=every)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '8'
          - '11'
          - '12'
      backfill_rounds:
        description: 'Older rounds to build stored ranking fields for, per tournament (0 disables)'
        required: false
        default: '100'
      top_n:
        description: 'Top N staked models per tournament'
        required: false
        default: '5000'
      reset:
        description: 'Clear each tournament before writing (one-off migrations only; normal runs upsert)'
        required: false
        default: false
        type: boolean

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    # Normal runs upsert (INSERT OR REPLACE), so the store is incremental and
    # quick. A full 'all' run still fetches every tournament's models, so allow
    # generous headroom (GitHub's hard cap is 360 min).
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESET_FLAG: ${{ inputs.reset && '--reset' || '' }}
      # A full Classic fleet holds millions of per-round records in memory during
      # the run; raise Node's heap (GitHub runners have ~16GB RAM).
      NODE_OPTIONS: --max-old-space-size=12288
      TOP_N: ${{ inputs.top_n || '5000' }}
      # Each backfilled round reads one round's field (~4.6k rows). 100 a run is a
      # small share of D1's free daily reads and covers ~2,900 rounds of history
      # in about a month.
      BACKFILL_ROUNDS: ${{ inputs.backfill_rounds || '100' }}
      TOURNAMENT: ${{ inputs.tournament || 'all' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Run Classic (tournament 8). Skipped if user picked 11 only.
      - name: Precompute Classic
        if: ${{ env.TOURNAMENT == 'all' || env.TOURNAMENT == '8' }}
        working-directory: worker
        run: npm run precompute:prod -- --tournament 8 --top-n "$TOP_N" --backfill-rounds "$BACKFILL_ROUNDS" --no-cache $RESET_FLAG

      # Run Signals (tournament 11). Skipped if user picked 8 only.
      # Signals is per-model alpha/mpc fetch on top of profile — keep top-n
      # modest if you trigger this manually with a big N.
      # `!cancelled()` decouples the tournaments: a failure in an earlier step no
      # longer skips this one, while a manual cancel or timeout still stops it.
      - name: Precompute Signals
        if: ${{ !cancelled() && (env.TOURNAMENT == 'all' || env.TOURNAMENT == '11') }}
        working-directory: worker
        run: npm run precompute:prod -- --tournament 11 --top-n "$TOP_N" --backfill-rounds "$BACKFILL_ROUNDS" --no-cache $RESET_FLAG

      # Run Crypto (tournament 12). Like Signals, performance is a per-model
      # v2RoundModelPerformances fetch (no profile query exists for crypto), so
      # it's slow on large fleets — keep top-n modest if triggered with a big N.
      # `!cancelled()` so a Classic/Signals failure doesn't skip Crypto.
      - name: Precompute Crypto
        if: ${{ !cancelled() && (env.TOURNAMENT == 'all' || env.TOURNAMENT == '12') }}
        working-directory: worker
        run: npm run precompute:prod -- --tournament 12 --top-n "$TOP_N" --backfill-rounds "$BACKFILL_ROUNDS" --no-cache $RESET_FLAG

      # Sanity log of how far each tournament's data now reaches, read from the
      # tournament_coverage rows each precompute step just refreshed (Step 6). One
      # row per tournament: MAX(round_number) over model_performances instead walks
      # every newer row of the other tournaments on production's round index, and
      # a COUNT(*) scans millions — both eat D1's free daily read quota. Also
      # confirms Step 6 actually ran.
      - name: Verify D1 latest rounds
        if: always()
        working-directory: worker
        run: |
          npx wrangler d1 execute numerai-cache --remote --command \
            "SELECT tournament, earliest_round, latest_round, datetime(updated_at, 'unixepoch') AS refreshed_at FROM tournament_coverage ORDER BY tournament;"
